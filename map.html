<!DOCTYPE html>
<html>
<head>
  <title>Farmer Profile</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f7f3;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }
    .profile-card {
      background: #fff;
      height: 80px;
      padding: 25px;
     border-top-left-radius: 20px;
     border-top-right-radius: 20px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      display: flex;
      gap: 25px;
      align-items: center;
    }

    .profile-pic {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 4px solid #2e7d32;
      object-fit: cover;
    }

    .profile-info h1 {
      margin: 0;
      color: #2e7d32;
    }

    .profile-info p {
      margin-top: 6px;
      color: #555;
      font-size: 16px;
    }
    .map-box {
      margin-top: 25px;
      height: 475px;
      border-bottom-left-radius: 20px;
     border-bottom-right-radius: 20px;
      margin: 0px;
      overflow: hidden;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    }

  </style>
</head>
<body>

<div class="container">

  <!-- Farmer Profile -->
  <div class="profile-card">
    <img src="https://via.placeholder.com/130" id="farmerImg" class="profile-pic">

    <div class="profile-info">
      <h2 id="farmerName">Farmer Name</h2>
      <p id="farmerAddress">Farm Location</p>
    </div>
  </div>

  <!-- Google Map -->
  <div class="map-box">
    <iframe id="farmerMap"
      src=""
      width="100%" height="100%" frameborder="0">
    </iframe>
  </div>

</div>

</body>
<script type="module">
import { db } from "./firebase.js";
import { ref, get } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

// Get productId from URL (map.html?productId=XYZ)
const params = new URLSearchParams(window.location.search);
const productId = params.get("productId");

if (!productId) {
  alert("Product ID missing!");
  throw new Error("No productId");
}

// Reference to the product in Firebase
const productRef = ref(db, "products/" + productId);

get(productRef).then((snap) => {
  if (!snap.exists()) {
    alert("Product not found!");
    return;
  }

  const product = snap.val();

  // Set farmer image
  document.getElementById("farmerImg").src = product.farmerImage || "https://via.placeholder.com/130";

  // Set farmer name
  document.getElementById("farmerName").innerText = product.farmerName || "Farmer Name";

  // Set farmer address
  document.getElementById("farmerAddress").innerText = product.farmerAddress || "Farm Location";

  // Set Google map
  const mapIframe = document.getElementById("farmerMap");
  const address = encodeURIComponent(product.farmerAddress || "India");
  mapIframe.src = `https://maps.google.com/maps?q=${address}&z=13&output=embed`;
});
</script>
</html>
