<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KisanAuction – Product Post</title>
 <style>
    body {
  font-family: 'Segoe UI', sans-serif;
  background: #f4f6f5;
  display: flex;
  justify-content: center;
  padding: 40px;
}

.product-card {
  width: 320px;
  background: #fff;
  border-radius: 14px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.1);
  overflow: hidden;
}

/* Farmer Header */
.farmer-header {
  display: flex;
  align-items: center;
  padding: 12px;
}

.farmer-img {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  margin-right: 10px;
  object-fit: cover;
}

.farmer-header h3 {
  margin: 0;
  font-size: 16px;
  color: #2f6f54;
}

.farmer-header p {
  margin: 2px 0 0;
  font-size: 12px;
  color: #777;
}

/* Product Image */
.product-img {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

/* Details */
.product-details {
  padding: 12px;
  font-size: 14px;
}

.product-details p {
  margin: 6px 0;
}

/* Buttons */
.action-buttons {
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.btn {
  border: none;
  padding: 10px;
  font-size: 14px;
  border-radius: 8px;
  cursor: pointer;
}

.auction {
  background: #2f6f54;
  color: white;
}

.location {
  background: #e8f5ee;
  color: #2f6f54;
  border: 1px solid #2f6f54;
}

.btn:hover {
  opacity: 0.9;
}

 </style>
</head>
<body>

<div class="product-card">

  <!-- Farmer Profile -->
  <div class="farmer-header">
    <img src="assets/images/buyersnap.jpg" alt="Farmer" class="farmer-img">
    <div>
      <h3>Ramesh Patil</h3>
      <p>Farmer ID: KA102 • Nashik</p>
      
    </div>
  </div>

  <!-- Product Image -->
  <img src="assets/images/tomato.jpg" alt="Product" class="product-img">

  <!-- Product Details -->
  <div class="product-details">
    <p><strong>🌾 Crop:</strong> Tomato</p>
    <p><strong>📦 Quantity:</strong> 50 Quintals</p>
    <p><strong>💰 Base Price:</strong> ₹2200 / Quintal</p>
    <p><strong>⭐ Quality:</strong> Grade A</p>
    <p><strong>⏳ Bid Duration:</strong>2 days</p>
    <p><strong>🔴 Status:</strong> Bidding Closed</p>
  </div>

  <!-- Buttons -->
  <div class="action-buttons">
    <button class="btn auction">View Auction</button>
    <button class="btn location">View Farm Location</button>
  </div>

</div>

</body>
</html>
