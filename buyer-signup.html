<html>
<head>
    <link rel="stylesheet" type="text/css" href="css/style.css"/>
<link rel="stylesheet" type="text/css" href="css/bootstrap.css"/>
<link rel="stylesheet" type="text/css" href="css/bootstrap-grid.css"/>
<link rel="stylesheet" type="text/css" href="css/bootstrap-reboot.css"/>
<link rel="stylesheet" type="text/css" href="css/bootstrap-utilities.css"/>

<script type="text/javascript" src="js/bootstrap.bundle.js"></script>


    <title>Buyer Login</title>
    <style>
    .formm
        {
            width: 30%;
            border: 1px solid #000000;
            border-radius: 20px;
            padding: 10px;
            background-color:rgb(230, 228, 228);
            margin-top:120px;
            height:90%;

        }

        .btn
        {
            width:30%;
            border:none;
            background:#2E7D32;
            border-radius: 20px;
            font-size: 15px;
            height: 7%;
            font-weight: bold;
            font-style:normal;
            color:white;
            margin-top: 3%;
        }
        .inputtype
        {
            width:70%;
            height: 6%;
            padding:10px;
            border:none;
            border-radius: 10px;
            border-bottom: 2px solid #aaa;
            margin-top: 3%;
        }
        .circle-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .formm h4{
        font-size:medium;
        margin-top:5%;
    }

    </style>
</head>
<body>
    <center>
    <form name="f1" class="formm" method="post">
         
        <center><img src="assets/images/buyersnap.jpg" align="bottom" class="circle-img" style="height:200px;width:200px;border:1px solid black;"></center>
    <h2 style="color:#2E7D32;margin-top: 5%;"><center>Buyer Registration</center></h2>
    <center>
<input type="text" class="inputtype" placeholder="Enter Name" required><br>
                <input type="address" class="inputtype" placeholder="Enter Address" required><br>
                <input type="email" class="inputtype" placeholder="Enter Email" required><br>
                <input type="number" class="inputtype" placeholder="Enter Mobile Number" required><br>
                <input type="number" class="inputtype" placeholder="Enter Aadhar number" required><br>
                 <input type="password" class="inputtype" placeholder="Enter password" required><br>
                <button class="btn">Register</button><br><br>  
    
    </center>
    
    </form>
    </center>
</body>
</html>
