<html>
<head>
    <link rel="stylesheet" type="text/css" href="css/style.css"/>
<link rel="stylesheet" type="text/css" href="css/bootstrap.css"/>
<link rel="stylesheet" type="text/css" href="css/bootstrap-grid.css"/>
<link rel="stylesheet" type="text/css" href="css/bootstrap-reboot.css"/>
<link rel="stylesheet" type="text/css" href="css/bootstrap-utilities.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script type="text/javascript" src="js/bootstrap.bundle.js"></script>


    <title>Buyer Login</title>
    <style>
    .formm
        {
            width: 30%;
            border: 1px solid #000000;
            border-radius: 20px;
            padding: 10px;
            background-color:rgb(230, 228, 228);
            margin-top:120px;
            height:90%;

        }

        .btn
        {
            width:30%;
            border:none;
            background:#2E7D32;
            border-radius: 20px;
            font-size: 15px;
            height: 7%;
            font-weight: bold;
            font-style:normal;
            color:white;
            margin-top: 3%;
        }
        .inputtype
        {
            width:70%;
            height: 6%;
            padding:10px;
            border:none;
            border-radius: 10px;
            border-bottom: 2px solid #aaa;
            margin-top: 3%;
        }
        .circle-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .formm h4{
        font-size:medium;
        margin-top:5%;
    }

    </style>
</head>
<body>
    <center>
    <form name="f1" class="formm" id="form" method="post">
         
        <center><img src="assets/images/buyersnap.jpg" align="bottom" class="circle-img" style="height:200px;width:200px;border:1px solid black;"></center>
    <h2 style="color:#2E7D32;margin-top: 5%;"><center>Buyer Registration</center></h2>
    <center>

         <input type="text" class="inputtype" id="bname" placeholder="Enter Name" required><br>
    <input type="text" class="inputtype" id="badd"placeholder="Enter Address" required><br>
    <input type="email" class="inputtype" id="bemail" placeholder="Enter Email" required><br>
    <input type="number" class="inputtype" id="bmobile" placeholder="Enter Mobile Number" required><br>
    <input type="password" class="inputtype" id="bpassword" placeholder="Enter password" required><br>
    
    <button type="submit" class="btn">Register</button><br><br>       
    
    </center>
    
    </form>
    </center>



   
<script type="module">
import { buyerSignup } from "./auth.js";

document.querySelector("#form").addEventListener("submit", function(e){
    e.preventDefault();

    // Get values from input fields
    const name = document.getElementById("bname").value;
    const address = document.getElementById("badd").value;
    const email = document.getElementById("bemail").value;
    const mobile = document.getElementById("bmobile").value;

    const password = document.getElementById("bpassword").value;

    // Call buyerSignup from auth.js
    buyerSignup(email, password, { name, address, mobile});
});


</script>
</body>
</html>
