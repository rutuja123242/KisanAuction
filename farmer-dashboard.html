 height:30%;

<!-- PROFILE -->
<div id="pro" class="sec" >
  <h3>Profile</h3>

  <label>Upload Profile Image</label>
  <input type="file" id="pimg">

  <label>Farmer Name</label>
  <input id="pname" placeholder="Enter farmer name">


  <label>Location(full address)</label>
  <input id="pstate" placeholder="Enter full address">

  <label>Contact Number</label>
  <input id="pphone" placeholder="10 digit mobile number">

  <label>Email</label>
  <input id="pemail" placeholder="example@gmail.com">

<script type="module">


  import { db,auth } from './firebase.js';
  import { ref, set, get, update, push, onValue, query, orderByChild, equalTo, remove } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";


window.openBids = function(productId, crop, quality) {
  localStorage.setItem("activeProductId", productId);
  localStorage.setItem("activeCrop", crop);
  localStorage.setItem("activeQuality", quality);

  show('bid');
  loadBidsForFarmer();
};



window.show = function(sectionId) {
  const sections = document.querySelectorAll('.sec');
  sections.forEach(sec => sec.classList.remove('active'));

  document.getElementById(sectionId).classList.add('active');

  if (sectionId === "bid") {
    loadBidsForFarmer();
  }
};
 
  

window.addProd = async function () {

  

  const user = auth.currentUser;
  if (!user) {
    alert("Login first");
    return;
  }

  const nameVal = document.getElementById("name").value.trim();
  const qtyVal = document.getElementById("qty").value.trim();
  const priceVal = document.getElementById("price").value.trim();
  const qualityVal = document.getElementById("quality").value.trim();
  const auctionEndVal = document.getElementById("auctionEnd").value;
  const locationVal = document.getElementById("location").value.trim();
  const file = document.getElementById("img").files[0];

  if (
    !nameVal ||
    !qtyVal ||
    !priceVal ||
    !qualityVal ||
    !auctionEndVal ||
    !locationVal
  ) {
    alert("Fill all fields!");
    return;
  }

  if (!file) {
    alert("Please select product image");
    return;
  }

  // ✅ get farmer profile
  const farmerSnap = await get(ref(db, "farmers/" + user.uid));
  if (!farmerSnap.exists()) {
    alert("Please save profile first");
    return;
  }

  const farmer = farmerSnap.val();

  const reader = new FileReader();
  reader.onload = async () => {

    const productData = {
      crop: nameVal,
      quantity: qtyVal,
      price: priceVal,
      quality: qualityVal,
      auctionEnd: auctionEndVal,
      location: locationVal,

      productImage: reader.result,

      farmerId: user.uid,
      farmerName: farmer.name,
      farmerAddress: farmer.address,
      farmerImage: farmer.image
    };

    try {
      await set(push(ref(db, "products")), productData);
      alert("✅ Product added successfully");
      show('dash');

      // clear form
      document.getElementById("name").value = "";
      document.getElementById("qty").value = "";
      document.getElementById("price").value = "";
      document.getElementById("quality").value = "";
      document.getElementById("auctionEnd").value = "";
      document.getElementById("location").value = "";
      document.getElementById("img").value = "";

    } catch (e) {
      console.error(e);
      alert("❌ Error adding product");
    }
  };

  reader.readAsDataURL(file);
};

function loadMyProducts() {
  const cards = document.querySelector("#dash .cards");

  auth.onAuthStateChanged(user => {
    if (!user) return;

    const q = query(
      ref(db, "products"),
      orderByChild("farmerId"),
      equalTo(user.uid)
    );

    onValue(q, (snapshot) => {
      cards.innerHTML = "";

      snapshot.forEach(child => {
        const product = child.val();
        const key = child.key;

        const card = document.createElement("div");
        card.className = "farmer-product-card";

        card.innerHTML = `
          <img src="${product.productImage}" class="product-img">

          <div class="product-details">
            <p>🌱 <b>Crop:</b> ${product.crop}</p>
            <p>📦 <b>Quantity:</b> ${product.quantity} </p>
            <p>💰 <b>Base Price:</b> ₹${product.price} </p>
            <p>⭐ <b>Quality:</b> ${product.quality}</p>
          </div>

          <div class="farmer-actions">
           <button class="btn view" onclick="openBids('${key}','${product.crop}','${product.quality}')">
  View Bids
</button>
            <button class="btn delete" onclick="deleteProd('${key}')">Delete Product</button>
          </div>
        `;

        cards.appendChild(card);
      });
    });
  });
}

window.deleteProd = function (id) {
  if (confirm("Delete this product?")) {
    remove(ref(db, "products/" + id));
  }
};
   
            

    
// Save Profile
window.saveProfile = async function() {
  const user = auth.currentUser;
  if (!user) { alert("Login first"); return; }

  const file = document.getElementById("pimg").files[0];
  if (!file) { alert("Upload profile image"); return; }

  const reader = new FileReader();
  reader.onload = async () => {
    const data = {
      name: document.getElementById("pname").value,
      address: document.getElementById("pstate").value,
      phone: document.getElementById("pphone").value,
      email: document.getElementById("pemail").value,
      image: reader.result
    };

    try {
      await set(ref(db, "farmers/" + user.uid), data);
      alert("Profile saved successfully!");
    } catch(err) {
      console.error(err);
      alert("Error saving profile!");
    }
  };
  reader.readAsDataURL(file);
};

// Update Profile
window.updateProfile = async function() {
  const user = auth.currentUser;
  if (!user) { alert("Login first"); return; }

  const snapshot = await get(ref(db, "farmers/" + user.uid));
  if (!snapshot.exists()) { alert("No profile to update"); return; }

  const prevData = snapshot.val();
  const file = document.getElementById("pimg").files[0];

  const reader = new FileReader();
  reader.onload = async () => {
    const updatedData = {
      name: document.getElementById("pname").value || prevData.name,
      address: document.getElementById("pstate").value || prevData.address,
      phone: document.getElementById("pphone").value || prevData.phone,
      email: document.getElementById("pemail").value || prevData.email,
      image: file ? reader.result : prevData.image
    };

    try {
      await update(ref(db, "farmers/" + user.uid), updatedData);
      alert("Profile updated successfully!");
    } catch(err) {
      console.error(err);
      alert("Error updating profile!");
    }
  };

  if (file) reader.readAsDataURL(file);
  else reader.onload(); // keep previous image
};

// Auto-fill previous data
auth.onAuthStateChanged(async user => {
  if (!user) return;
  const snapshot = await get(ref(db, "farmers/" + user.uid));
  if (!snapshot.exists()) return;

  const data = snapshot.val();
  document.getElementById("pname").value = data.name || "";
  document.getElementById("pstate").value = data.address || "";
  document.getElementById("pphone").value = data.phone || "";
  document.getElementById("pemail").value = data.email || "";
});


window.loadBidsForFarmer = function() {

  const productId = localStorage.getItem("activeProductId");
  const crop = localStorage.getItem("activeCrop");
  const quality = localStorage.getItem("activeQuality");

  if (!productId) return;

  const table = document.getElementById("farmerBidTable");
  table.innerHTML = "";

  onValue(ref(db, "bids/" + productId), snapshot => {

    table.innerHTML = "";

    snapshot.forEach(child => {
      const bid = child.val();
      const bidId = child.key;

      if (bid.status === "rejected") return;
let actionHTML = "";

      if (bid.status === "accepted") {
        actionHTML = `<span style="color:green;font-weight:bold;">✅ Accepted</span>`;
      } else {
        actionHTML = `<button class="btn" onclick="acceptBid('${productId}','${bidId}','${bid.contact}', this)">Accept</button>`;
      }

      table.innerHTML += `
        <tr>
          <td>${crop}</td>
          <td>${quality}</td>
          <td>${bid.buyerName}</td>
          <td>${bid.contact}</td>
          <td>₹${bid.amount}</td>
          <td>${bid.dateTime}</td>
          <td>${actionHTML}</td>
        </tr>
      `;
    });
  });
};


    

  
  window.acceptBid = function(productId, bidId, phone) {

  update(ref(db, `bids/${productId}/${bidId}`), {
    status: "accepted"
  });

  onValue(ref(db, "bids/" + productId), snap => {
    snap.forEach(b => {
      if (b.key !== bidId) {
        update(ref(db, `bids/${productId}/${b.key}`), {
          status: "rejected"
        });
      }
    });
  }, { onlyOnce: true });

  window.open(
    `https://wa.me/91${phone}?text=Your bid has been accepted successfully`
  );
if(btn){
   
    const td = btn.parentElement; // the <td> containing the button
    td.innerHTML = `<span style="color:green;font-weight:bold;">✅ Accepted</span>`;
  
  }
};

  



loadMyProducts();


</script>
